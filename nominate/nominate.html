<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 ANIME AWARDS - Nominate</title>
  <link rel="stylesheet" href="./nominate.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../winnerStage.css">
  <link rel="stylesheet" href="../nominationGuide.css">
  <link rel="stylesheet" href="./nominate-polish.css">
  <link rel="stylesheet" href="../palette-components.css">
  <link rel="stylesheet" href="../posterCards.css">
  <link rel="stylesheet" href="../nominateUI.css">
</head>
<body class="nominate-ui poster-nomination">

  <nav class="top-nav">
    <div class="nav-content-area">
      <span class="brand">2026 ANIME AWARDS</span>
      <span id="step-title"></span>
    </div>
    <div class="nav-sidebar-area">
      <div class="search-container">
        <input type="text" id="search-input" placeholder="애니 제목 검색" autocomplete="off">
        <div id="autocomplete-list" class="autocomplete-items"></div>
      </div>
    </div>
  </nav>

  <main class="content-wrapper">
    <div class="container">
      <section class="content-area" id="left-area">
        </section>

      <aside class="sidebar">
        <div class="fixed-sidebar-content">
          <div id="preview-section" class="preview-container">
            <div id="preview-box" class="preview-box"></div>
          </div>

          <div class="action-buttons">
            <button id="nav-home-btn" class="btn-outline">메인으로</button>
            <button id="step1-next-btn" class="gold-btn" disabled>다음 단계</button>
            
            <button id="step2-back-btn" class="btn-outline hidden">이전 단계</button>
            <button id="step2-award-btn" class="gold-btn hidden" disabled>수상 결정</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

<div id="pv-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pv-modal-title">
    <div class="unified-close-panel modal-content pv-modal-content">
<button class="unified-modal-close" type="button" aria-label="모달 닫기" id="pv-modal-close">×</button>
<div class="unified-modal-scroll">
      
      <h2 id="pv-modal-title" class="modal-header">작품 PV</h2>
      <hr class="modal-divider">
      <div id="pv-track-buttons" class="pv-track-buttons" role="group" aria-label="PV 선택"></div>
      <div class="pv-player-frame">
        <iframe id="pv-player" title="PV 재생" hidden
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <p id="pv-player-empty" class="pv-player-empty" role="status">등록된 PV가 없습니다.</p>
      </div>
      <div class="pv-player-footer">
        <span>재생이 제한된 영상은 유튜브에서 확인해주세요.</span>
        <a id="pv-external-link" target="_blank" rel="noopener noreferrer" hidden>유튜브에서 보기</a>
      </div>
    </div>
</div>
  </div>

  <div id="winner-modal" class="modal hidden">
    <div class="modal-content">
      <h2 class="modal-header">FINAL WINNER</h2>
      <hr class="modal-divider">

      <div class="winner-layout">
        <div class="winner-left">
          <img id="modal-img" src="../image/no-image.svg" alt="수상작 이미지" onerror="this.onerror=null;this.src='../image/no-image.svg'"/>
        </div>
        <div class="winner-right">
          <div id="winner-info-text">
            <h3 id="modal-title">작품 제목</h3>

            <div class="info-row">
              <span class="info-label">Quarter:</span>
              <span id="modal-quarter" class="info-value">-</span>
            </div>

            <div class="info-row" id="modal-director-row">
              <span class="info-label">Director:</span>
              <span id="modal-director" class="info-value">-</span>
            </div>

            <div class="info-row" id="modal-studio-row">
                <span class="info-label" id="modal-studio-label">Studio:</span>
                <span id="modal-studio" class="info-value">-</span>
            </div>
            <div class="info-row" id="modal-award-row">
                <span class="info-label">Award:</span>
                <span id="modal-award-name" class="info-value">대상</span>
            </div>
          </div>
          <button class="gold-btn full-width" id="go-main-btn">
            확인 및 메인으로
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../data/manifest.js"></script>
  <script type="text/plain" data-app-src="../resultStorage.js"></script>
  <script type="text/plain" data-year-src="../data/{year}/{year}animeData.js"></script>
  <script type="text/plain" data-year-src="../data/{year}/{year}animeSongsData.js"></script>
  <script type="text/plain" data-app-src="../data/resolveYear.js"></script>
  <script type="text/plain" data-app-src="../seasonFilter.js"></script>
  <script type="text/plain" data-app-src="../nominateCommon.js"></script>
    <script type="text/plain" data-app-src="../winnerStage.js"></script>
  <script type="text/plain" data-app-src="./nominate.js"></script>
  <script type="text/plain" data-app-src="../firebase_service.js" data-module="true"></script>
  <script type="text/plain" data-app-src="../nominationGuide.js"></script>
<script src="../data/pageLoader.js"></script>
</body>
</html>
