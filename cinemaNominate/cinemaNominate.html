<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 ANIME AWARDS - Nominate</title>
    <link rel="stylesheet" href="./cinemaNominate.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link rel="stylesheet" href="../winnerStage.css">
  <link rel="stylesheet" href="../palette-components.css">
  <link rel="stylesheet" href="../posterCards.css">
  <link rel="stylesheet" href="../nominateUI.css">
</head>
<body class="nominate-ui poster-nomination">
    <nav class="top-nav">
        <div class="nav-content-area">
            <span class="brand">2026 ANIME AWARDS</span>
            <span id="step-title"></span>
        </div>
        <div class="nav-search-area">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="애니 제목 검색">
                <div id="autocompleteList" class="autocomplete-list"></div>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="container">
            <main class="content-area">
                <div id="cardGrid" class="cinema-vote-grid">
                    </div>
            </main>

            <aside class="sidebar">
                <div class="action-buttons">
                    <button id="btn-home" class="btn-outline" onclick="location.href=AwardPage.homeUrl()">메인으로</button>
                    <button id="btn-award" class="gold-btn" disabled onclick="saveCinemaWinner()">수상 결정</button>
                </div>
            </aside>
        </div>
    </div>

    <div id="winner-popup" class="modal hidden"></div>

    <script src="../data/manifest.js"></script>
    <script type="text/plain" data-app-src="../resultStorage.js"></script>
    <script type="text/plain" data-app-src="../nominateCommon.js"></script>
    <script type="text/plain" data-app-src="../winnerStage.js"></script>
    <script type="text/plain" data-year-src="../data/{year}/{year}animeData.js"></script>
    <script type="text/plain" data-app-src="../data/resolveYear.js"></script>      <!-- ← cinemaNominate.js보다 앞으로 -->
    <script type="text/plain" data-app-src="../seasonFilter.js"></script>            <!-- ← cinemaNominate.js보다 앞으로 -->
    <script type="text/plain" data-app-src="./cinemaNominate.js"></script>            <!-- ← 맨 마지막 -->
    <script type="text/plain" data-app-src="../firebase_service.js" data-module="true"></script>
<script src="../data/pageLoader.js"></script>
</body>
</html>
