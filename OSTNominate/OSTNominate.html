<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 ANIME AWARDS - OST Nominate</title>
  <link rel="stylesheet" href="../nominate/nominate.css">
  <link rel="stylesheet" href="./OSTNominate.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../winnerStage.css">
    <link rel="stylesheet" href="../nominationGuide.css">
</head>
<body>
  <nav class="top-nav">
    <div class="nav-content-area"><span class="brand">2026 ANIME AWARDS</span><span id="step-title"></span></div>
    <div class="nav-sidebar-area"><div class="search-container">
      <input type="text" id="search-input" placeholder="애니 제목 검색" autocomplete="off">
      <div id="autocomplete-list" class="autocomplete-items"></div>
    </div></div>
  </nav>
  <main class="content-wrapper"><div class="container">
    <section class="content-area" id="left-area"></section>
    <aside class="sidebar"><div class="fixed-sidebar-content">
      <div id="preview-section" class="preview-container"><div id="preview-box" class="preview-box"></div></div>
      <div class="action-buttons">
        <button id="nav-home-btn" class="btn-outline">메인으로</button>
        <button id="step1-next-btn" class="gold-btn" disabled>다음 단계</button>
        <button id="step2-back-btn" class="btn-outline hidden">이전 단계</button>
        <button id="step2-award-btn" class="gold-btn hidden" disabled>수상 결정</button>
      </div>
    </div></aside>
  </div></main>

  <div id="ost-listen-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="ost-modal-title">
    <div class="modal-content ost-modal-content">
      <button class="ost-modal-close" id="ost-modal-close" aria-label="닫기">&times;</button>
      <div class="ost-modal-body">
      <div class="ost-modal-left">
        <img id="ost-modal-image" src="" alt="애니메이션 이미지">
        <h2 id="ost-modal-title"></h2>
        <p class="ost-composer-label">Composer</p><p id="ost-modal-composer" class="ost-composer"></p>
        <div id="ost-album-picker" hidden><label for="ost-album-select">앨범 선택</label><select id="ost-album-select"></select></div>
        <p class="ost-composer-label">발매일</p><p id="ost-modal-release-date" class="ost-composer"></p>
      </div>
      <section class="ost-modal-right"><h3>OST 트랙</h3><div id="ost-track-grid" class="ost-track-grid"></div></section>
      </div>
    </div>
  </div>

  <div id="winner-modal" class="modal hidden">
    <div class="modal-content">
      <h2 class="modal-header">FINAL WINNER</h2><hr class="modal-divider">
      <div class="winner-layout">
        <div class="winner-left"><img id="modal-img" src="" alt="수상작 이미지"></div>
        <div class="winner-right"><div id="winner-info-text">
          <h3 id="modal-title">작품 제목</h3>
          <div class="info-row"><span class="info-label">Quarter:</span><span id="modal-quarter" class="info-value"></span></div>
          <div class="info-row"><span class="info-label">Composer:</span><span id="modal-composer" class="info-value"></span></div>
          <div class="info-row"><span class="info-label">Award:</span><span id="modal-award-name" class="info-value"></span></div>
        </div><button class="gold-btn full-width" id="go-main-btn">확인 및 메인으로</button></div>
      </div>
    </div>
  </div>

  <script src="../data/manifest.js"></script>
  <script src="../resultStorage.js"></script>
  <script src="../data/2026/2026animeData.js"></script>
  <script src="../data/2026/2026animeOSTData.js"></script>
  <script src="../data/resolveYear.js"></script>
  <script src="../seasonFilter.js"></script>
  <script src="../nominateCommon.js"></script>
    <script src="../winnerStage.js"></script>
  <script src="./OSTNominate.js"></script>
  <script type="module" src="../firebase_service.js"></script>
    <script src="../nominationGuide.js"></script>
</body>
</html>
