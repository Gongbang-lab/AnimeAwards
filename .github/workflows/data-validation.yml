name: Data validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test the validator
        run: npm run test:validator
      - name: Validate published years and file references
        run: npm run validate
      - name: Keep validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-validation-report
          path: |
            reports/data-validation.md
            reports/data-validation.json
          if-no-files-found: warn
          retention-days: 14
