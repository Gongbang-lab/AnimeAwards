<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 애니메이션 데이터 현황</title>
  <link rel="stylesheet" href="animeDataOverview.css">
  <script type="text/plain" data-collector-data="animeData"></script>
<script type="text/plain" data-collector-data="animeSongsData"></script>
<script type="text/plain" data-collector-data="animeOSTData"></script>

<body>
  <main>
    <header><p class="eyebrow">ANIME AWARDS · DATA</p><h1>2026 애니메이션 데이터 현황</h1>
