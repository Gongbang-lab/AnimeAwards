<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>애니메이션 곡 데이터 편집기</title>
  <style>
    :root { color-scheme: light; font-family: Pretendard, "Malgun Gothic", sans-serif; }
    body { margin: 0; padding: 24px; background: #f1f5f9; color: #1e293b; }
    .container { max-width: 980px; margin: auto; padding: 28px; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px #0f172a18; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .description, .muted { color: #64748b; line-height: 1.6; }
    .search-row, .meta-row, .section-heading, .toolbar { display: flex; align-items: end; gap: 12px; }
    .search-row { margin: 24px 0 12px; }
    .meta-row { margin: 12px 0 20px; }
    .field { display: flex; flex: 1; flex-direction: column; gap: 6px; min-width: 0; }
    label { font-size: 13px; font-weight: 700; color: #475569; }
    input, select { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    button { border: 0; border-radius: 8px; padding: 11px 16px; background: #334155; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .primary { background: #2563eb; }
    .add-button { background: #0f766e; padding: 8px 12px; }
    .remove-button { background: #b91c1c; padding: 7px 10px; }
    #status { min-height: 24px; margin: 8px 0 18px; color: #2563eb; font-weight: 700; }
    #animeTitle { margin: 8px 0 4px; font-size: 20px; }
    .music-section { margin-top: 24px; padding-top: 18px; border-top: 1px solid #e2e8f0; }
    .section-heading { justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-heading h2 { margin: 0; font-size: 19px; }
    .music-card { margin: 10px 0; padding: 16px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; }
    .card-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; color: #475569; font-size: 13px; font-weight: 700; }
    .edit-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .edit-grid .full { grid-column: 1 / -1; }
    .toolbar { justify-content: space-between; align-items: center; margin-top: 30px; }
    #resultArea { width: 100%; min-height: 320px; margin-top: 12px; box-sizing: border-box; padding: 16px; border: 0; border-radius: 10px; background: #0f172a; color: #cbd5e1; font: 13px/1.5 Consolas, monospace; white-space: pre; }
    @media (max-width: 640px) { body { padding: 12px; } .container { padding: 18px; } .search-row, .meta-row { align-items: stretch; flex-direction: column; } .edit-grid { grid-template-columns: 1fr; } .edit-grid .full { grid-column: auto; } .toolbar { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
<main class="container">
  <h1>🎵 애니메이션 곡 데이터 편집기</h1>
  <p class="description">AniList API를 호출하지 않습니다. 2026 작품 목록에서 제목·분기 정보를 찾고, 곡 데이터는 기존 JS 파일에서 불러와 편집합니다. 변경한 전체 데이터 배열을 JS로 복사할 수 있습니다.</p>

  <div class="search-row">
    <div class="field">
      <label for="animeId">애니메이션 ID</label>
      <input id="animeId" type="number" min="1" placeholder="예: 63468">
    </div>
    <button id="searchButton" class="primary" type="button">데이터 불러오기</button>
  </div>
  <div id="status" role="status"></div>
  <h2 id="animeTitle">작품을 검색해 주세요</h2>

  <div class="meta-row">
    <div class="field">
      <label for="year">연도</label>
      <input id="year" type="number" min="1900" max="2200" value="2026" disabled>
    </div>
    <div class="field">
      <label for="quarter">분기</label>
      <select id="quarter" disabled>
        <option value="1분기">1분기</option><option value="2분기">2분기</option>
        <option value="3분기">3분기</option><option value="4분기">4분기</option>
      </select>
    </div>
  </div>

  <section class="music-section">
    <div class="section-heading"><h2>오프닝 (OP)</h2><button class="add-button" type="button" data-add="op">+ OP 추가</button></div>
    <div id="opList"></div>
  </section>
  <section class="music-section">
    <div class="section-heading"><h2>엔딩 (ED)</h2><button class="add-button" type="button" data-add="ed">+ ED 추가</button></div>
    <div id="edList"></div>
  </section>
  <section class="music-section">
    <div class="section-heading"><h2>OST</h2><button class="add-button" type="button" data-add="ost">+ OST 추가</button></div>
    <div id="ostList"></div>
  </section>

  <div class="toolbar">
    <span class="muted">OP·ED·OST 입력값은 자동으로 전체 데이터에 반영됩니다.</span>
    <button id="copyButton" class="primary" type="button">완료된 데이터 JS 복사</button>
  </div>
  <textarea id="resultArea" readonly spellcheck="false" aria-label="완성된 AnimeSongs JavaScript 데이터"></textarea>
</main>

<script src="../data/2026/2026animeData.js"></script>
<script src="../data/2026/2026animeSongsData.js"></script>
<script>
  const workingData = JSON.parse(JSON.stringify(
    Array.isArray(window.AnimeSongs_2026) ? window.AnimeSongs_2026 : []
  ));
  const animeCatalog = Array.isArray(window.AnimeCatalog_2026) ? window.AnimeCatalog_2026 : [];
  let currentRecord = null;
  let currentTitle = "";

  const quarterSelect = document.getElementById("quarter");
  const yearInput = document.getElementById("year");
  const resultArea = document.getElementById("resultArea");

  function emptySong(type) {
    if (type === "ost") {
      return { type: "ost", composer: "", title_1: "", youtube_1: "", title_2: "", youtube_2: "" };
    }
    return { type, title: "", artist: "", youtube: "" };
  }

  function normalizeSong(song) {
    const type = String(song?.type || "").toLowerCase();
    if (type === "ost") {
      return {
        type: "ost",
        composer: String(song.composer || ""),
        title_1: String(song.title_1 || ""),
        youtube_1: String(song.youtube_1 || ""),
        title_2: String(song.title_2 || ""),
        youtube_2: String(song.youtube_2 || "")
      };
    }
    return {
      type: type === "ed" ? "ed" : "op",
      title: String(song?.title || ""),
      artist: String(song?.artist || ""),
      youtube: String(song?.youtube || "")
    };
  }

  function ensureEmptyCategories(record) {
    if (!Array.isArray(record.songs)) record.songs = [];
    record.songs = record.songs.map(normalizeSong);
    for (const type of ["op", "ed", "ost"]) {
      if (!record.songs.some(song => song.type === type)) record.songs.push(emptySong(type));
    }
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    })[char]);
  }

  function textField(label, value, index, field, full = false, placeholder = "") {
    return `<label class="${full ? "full" : ""}">${label}<input data-index="${index}" data-field="${field}" type="text" value="${escapeHtml(value)}" placeholder="${placeholder}"></label>`;
  }

  function renderSongGroup(type, targetId) {
    const target = document.getElementById(targetId);
    const matches = currentRecord.songs
      .map((song, index) => ({ song, index }))
      .filter(entry => entry.song.type === type);

    target.innerHTML = matches.map(({ song, index }, displayIndex) => {
      const removable = displayIndex > 0;
      const heading = type === "ost" ? `OST ${displayIndex + 1}` : `${type.toUpperCase()} ${displayIndex + 1}`;
      const fields = type === "ost"
        ? `<div class="edit-grid">
             ${textField("작곡가", song.composer, index, "composer", true)}
             ${textField("OST 제목 1", song.title_1, index, "title_1")}
             ${textField("YouTube URL 1", song.youtube_1, index, "youtube_1")}
             ${textField("OST 제목 2", song.title_2, index, "title_2")}
             ${textField("YouTube URL 2", song.youtube_2, index, "youtube_2")}
           </div>`
        : `<div class="edit-grid">
             ${textField("곡 제목", song.title, index, "title")}
             ${textField("아티스트", song.artist, index, "artist")}
             ${textField("YouTube URL", song.youtube, index, "youtube", true, "https://youtu.be/...")}
           </div>`;
      return `<article class="music-card">
        <div class="card-heading"><span>${heading}</span>${removable ? `<button class="remove-button" type="button" data-remove="${index}">삭제</button>` : ""}</div>
        ${fields}
      </article>`;
    }).join("");
  }

  function renderEditor() {
    const hasRecord = !!currentRecord;
    document.querySelectorAll("[data-add]").forEach(button => { button.disabled = !hasRecord; });
    if (!hasRecord) {
      for (const id of ["opList", "edList", "ostList"]) document.getElementById(id).innerHTML = "";
      updateOutput();
      return;
    }
    renderSongGroup("op", "opList");
    renderSongGroup("ed", "edList");
    renderSongGroup("ost", "ostList");
    updateOutput();
  }

  function updateOutput() {
    resultArea.value = `var AnimeSongs_2026 = ${JSON.stringify(workingData, null, 2)};\n`;
  }

  function setStatus(message, isError = false) {
    const status = document.getElementById("status");
    status.textContent = message;
    status.style.color = isError ? "#b91c1c" : "#2563eb";
  }

  function loadById() {
    const rawId = document.getElementById("animeId").value.trim();
    const id = Number(rawId);
    if (!Number.isInteger(id) || id <= 0) {
      setStatus("유효한 애니메이션 ID를 입력하세요.", true);
      return;
    }

    let index = workingData.findIndex(item => Number(item.id) === id);
    const animeMatches = animeCatalog.filter(item => Number(item.id) === id);
    const animeInfo = animeMatches.find(item => item.quarter === quarterSelect.value) || animeMatches[0];

    if (index >= 0) {
      currentRecord = workingData[index];
      currentTitle = animeInfo?.title || "";
      yearInput.value = currentRecord.year || animeInfo?.year || 2026;
      quarterSelect.value = currentRecord.quarter || animeInfo?.quarter || "1분기";
      ensureEmptyCategories(currentRecord);
      setStatus(`기존 곡 데이터를 불러왔습니다. (목록 ${workingData.length}개)`);
    } else {
      currentRecord = {
        id,
        year: animeInfo?.year || Number(yearInput.value) || 2026,
        quarter: animeInfo?.quarter || quarterSelect.value,
        songs: [emptySong("op"), emptySong("ed"), emptySong("ost")]
      };
      workingData.push(currentRecord);
      currentTitle = animeInfo?.title || "";
      yearInput.value = currentRecord.year;
      quarterSelect.value = currentRecord.quarter;
      setStatus(animeInfo
        ? `작품 목록에서 찾았습니다. 빈 OP·ED·OST 항목을 만들었습니다. (목록 ${workingData.length}개)`
        : `작품 목록에는 없지만 새 데이터 구조를 만들었습니다. 연도와 분기를 확인하세요. (목록 ${workingData.length}개)`);
    }

    document.getElementById("animeTitle").textContent = currentTitle || `작품 ID ${id}`;
    yearInput.disabled = false;
    quarterSelect.disabled = false;
    renderEditor();
  }

  document.getElementById("searchButton").addEventListener("click", loadById);
  document.getElementById("animeId").addEventListener("keydown", event => {
    if (event.key === "Enter") loadById();
  });

  document.querySelectorAll("[data-add]").forEach(button => {
    button.addEventListener("click", () => {
      if (!currentRecord) return;
      currentRecord.songs.push(emptySong(button.dataset.add));
      renderEditor();
      document.getElementById(`${button.dataset.add}List`)
        .lastElementChild?.querySelector("input")?.focus();
    });
  });

  document.querySelector("main").addEventListener("input", event => {
    const input = event.target.closest("input[data-index][data-field]");
    if (!input || !currentRecord) return;
    const song = currentRecord.songs[Number(input.dataset.index)];
    if (!song) return;
    song[input.dataset.field] = input.value;
    updateOutput();
  });

  document.querySelector("main").addEventListener("click", event => {
    const button = event.target.closest("button[data-remove]");
    if (!button || !currentRecord) return;
    currentRecord.songs.splice(Number(button.dataset.remove), 1);
    ensureEmptyCategories(currentRecord);
    renderEditor();
  });

  function updateMetadata() {
    if (!currentRecord) return;
    currentRecord.year = Number(yearInput.value) || 2026;
    currentRecord.quarter = quarterSelect.value;
    updateOutput();
  }
  yearInput.addEventListener("input", updateMetadata);
  quarterSelect.addEventListener("change", updateMetadata);

  document.getElementById("copyButton").addEventListener("click", async () => {
    updateOutput();
    try {
      await navigator.clipboard.writeText(resultArea.value);
      setStatus(`완성된 AnimeSongs_2026 배열을 복사했습니다. (${workingData.length}개 작품)`);
    } catch (error) {
      resultArea.focus();
      resultArea.select();
      setStatus("클립보드 접근이 제한되어 있습니다. 결과를 선택했으니 직접 복사하세요.", true);
    }
  });

  updateOutput();
</script>
</body>
</html>
