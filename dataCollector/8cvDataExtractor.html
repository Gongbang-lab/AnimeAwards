<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Voice Actor Data Extractor</title>
    <style>
        body { background: #111; color: #fff; font-family: 'Pretendard', sans-serif; text-align: center; padding: 50px 20px; }
        .box { background: #222; display: inline-block; width: 100%; max-width: 800px; padding: 40px; border-radius: 20px; border: 1px solid #333; box-sizing: border-box; }
        
        /* 버튼 스타일 */
        .btn-group { margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: all 0.2s; }
        #extract-btn { background: gold; color: #000; }
        #extract-btn:hover { background: #ffd700; transform: scale(1.02); }
        #copy-btn { background: #444; color: #fff; display: none; } /* 초기엔 숨김 */
        #copy-btn:hover { background: #555; }
        
        /* 미리보기 영역 */
        #preview-container { margin-top: 30px; display: none; text-align: left; }
        #preview-header { font-size: 14px; color: #aaa; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        #json-preview { 
            background: #000; color: #00ff41; padding: 20px; border-radius: 10px; 
            font-family: 'Consolas', 'Monaco', monospace; font-size: 13px;
            max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
            border: 1px solid #333; line-height: 1.5;
        }
        
        #status { margin-top: 20px; color: gold; font-weight: bold; white-space: pre-line; min-height: 40px; }
        .error-msg { color: #ff4d4d !important; }

        /* 스크롤바 커스텀 */
        #json-preview::-webkit-scrollbar { width: 8px; }
        #json-preview::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>성우 데이터 추출기</h1>
        <p style="color: #aaa;">데이터를 분석하고 결과를 미리 확인하거나 복사할 수 있습니다.</p>
        
        <div class="btn-group">
            <button id="extract-btn">데이터 분석하기</button>
            <button id="copy-btn">클립보드 복사</button>
        </div>

        <div id="status"></div>

        <div id="preview-container">
            <div id="preview-header">
                <span>미리보기 (Generated Code)</span>
                <span id="char-count" style="font-size: 12px;"></span>
            </div>
            <pre id="json-preview"></pre>
        </div>
    </div>

    <script src="../data/2026/2026animeData.js"></script>
    <script src="../data/2026/2026animeCharacterData.js"></script>

    <script>
let generatedCode = ""; // 생성된 코드를 저장할 변수

// "2,3분기" 형태의 문자열에서 가장 빠른 분기만 추출 ("2분기")
function getFirstQuarter(quarterStr) {
    if (!quarterStr) return quarterStr;
    return String(quarterStr).split(',')[0].trim();
}

// 분기 문자열에서 숫자만 뽑아 비교용으로 사용 (예: "3분기" -> 3)
function parseQuarterNum(quarterStr) {
    if (!quarterStr) return 99;
    const match = String(quarterStr).match(/(\d)/);
    return match ? parseInt(match[1], 10) : 99;
}

document.getElementById('extract-btn').onclick = function() {
    const statusDiv = document.getElementById('status');
    const previewContainer = document.getElementById('preview-container');
    const previewArea = document.getElementById('json-preview');
    const copyBtn = document.getElementById('copy-btn');
    const charCount = document.getElementById('char-count');
    
    try {
        if (typeof AnimeList_2026 === 'undefined' || typeof CharacterData_2026 === 'undefined') {
            throw new Error("데이터 파일(js)을 로드할 수 없습니다.");
        }

        // 작품 id -> { title, quarter, year } 매핑
        const animeInfoMap = {};
        AnimeList_2026.forEach(anime => {
            animeInfoMap[String(anime.id)] = {
                title: anime.title,
                quarter: getFirstQuarter(anime.quarter), // "2,3분기" -> "2분기"
                year: anime.year
            };
        });

        const actorMap = {};
        let processedCount = 0;

        CharacterData_2026.forEach(animeEntry => {
            const animeId = String(animeEntry.id);
            const animeInfo = animeInfoMap[animeId] || {};
            const animeTitle = animeInfo.title || animeEntry.title;
            const quarter = animeInfo.quarter || getFirstQuarter(animeEntry.quarter) || "";
            const year = animeInfo.year || "";
            const characters = animeEntry.characters || [];

            characters.forEach(char => {
                const actorName = (char.cv || char.vc || "").trim();
                if (!actorName || actorName === "정보 없음") return;

                if (!actorMap[actorName]) {
                    actorMap[actorName] = {
                        name: actorName,
                        cvimg: `image/cvimg/${actorName}.webp`,
                        gender: char.gender || "male",
                        characters: []
                    };
                }

                const existingIndex = actorMap[actorName].characters.findIndex(
                    c => c.charName === char.name && c.animeTitle === animeTitle
                );

                if (existingIndex === -1) {
                    // 처음 등장하는 캐릭터 -> 추가
                    actorMap[actorName].characters.push({
                        charName: char.name,
                        animeTitle: animeTitle,
                        img: char.img,
                        quarter: quarter,
                        year: year
                    });
                } else {
                    // 이미 존재하는 캐릭터(다른 분기로 중복 등장) -> 더 빠른 분기로 갱신
                    const existing = actorMap[actorName].characters[existingIndex];
                    if (parseQuarterNum(quarter) < parseQuarterNum(existing.quarter)) {
                        existing.quarter = quarter;
                        existing.year = year;
                    }
                }
            });
            processedCount++;
        });

        // 텍스트 생성
        generatedCode = "var CharacterVoiceData_2026 = " + JSON.stringify(actorMap, null, 2) + ";";
        
        // UI 업데이트
        previewArea.textContent = generatedCode;
        previewContainer.style.display = "block";
        copyBtn.style.display = "inline-block";
        charCount.textContent = `Total length: ${generatedCode.length.toLocaleString()} chars`;
        
        statusDiv.className = "";
        statusDiv.innerText = `✅ 분석 완료! ${processedCount}개의 작품을 처리했습니다.`;

    } catch (e) {
        statusDiv.className = "error-msg";
        statusDiv.innerText = "❌ 오류: " + e.message;
    }
};

// 복사 버튼 기능
document.getElementById('copy-btn').onclick = async function() {
    if (!generatedCode) return;
    
    try {
        await navigator.clipboard.writeText(generatedCode);
        const originalText = this.innerText;
        this.innerText = "✅ 복사 성공!";
        this.style.background = "gold";
        this.style.color = "#000";
        
        setTimeout(() => {
            this.innerText = originalText;
            this.style.background = "#444";
            this.style.color = "#fff";
        }, 2000);
    } catch (err) {
        alert("복사에 실패했습니다.");
    }
};
    </script>
</body>
</html>
