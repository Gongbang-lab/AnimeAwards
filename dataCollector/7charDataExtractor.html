<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>캐릭터 추출기 (MAL ID 검색 버전)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    /* 기존 스타일 유지 및 일부 개선 */
    body { font-family: 'Pretendard', sans-serif; padding: 20px; background: #f8f9fa; }
    .header { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-top: 5px solid #2563eb; }
    .search-area { max-width: 700px; display: flex; gap: 10px; align-items: center; }
    #idInput { flex: 1; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; font-size: 16px; }
    #idInput:focus { border-color: #2563eb; }

    .main { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
    .char-list { background: white; padding: 20px; border-radius: 12px; height: 750px; overflow-y: auto; border: 1px solid #e2e8f0; }
    .char-card { display: flex; gap: 15px; background: #fff; border: 1px solid #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 12px; }
    .char-card img { width: 80px; height: 110px; object-fit: cover; border-radius: 6px; background: #f8f9fa; }

    .edit-fields { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .edit-fields input, .edit-fields select { padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff; }
    .edit-fields select:focus, .edit-fields input:focus { outline: none; border-color: #2563eb; }

    #jsonPreview { width: 100%; height: 600px; background: #0f172a; color: #f1f5f9; padding: 15px; border-radius: 12px; font-family: 'Fira Code', monospace; font-size: 12px; box-sizing: border-box; overflow-x: auto; }
    .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn-search { background: #2563eb; color: white; width: 120px; margin-top: 0; }
    .btn-zip { background: #ea580c; color: white; }
    .btn-copy { background: #16a34a; color: white; }
    
    .quarter-select { padding: 10px; border-radius: 6px; border: 2px solid #2563eb; font-weight: bold; font-family: inherit; font-size: 14px; }
    #yearInput { width: 90px; }
    
    #status { font-weight: bold; color: #2563eb; }
  </style>
</head>
<body>

<div class="header">
  <h2>👥 캐릭터 추출기 (MAL ID 검색 방식)</h2>
  <div class="search-area">
    <input type="number" id="idInput" placeholder="MyAnimeList ID를 입력하세요 (예: 5114)" onkeypress="if(event.keyCode==13) fetchByMalId()">
    <button class="btn btn-search" onclick="fetchByMalId()">데이터 불러오기</button>

    <!-- 연도 입력 필드 추가 -->
    <input type="number" id="yearInput" class="quarter-select" placeholder="연도" oninput="updateJSON()">
    
    <select id="quarterSelect" class="quarter-select" onchange="updateJSON()">
      <option value="Q1">Q1</option>
      <option value="Q2">Q2</option>
      <option value="Q3">Q3</option>
      <option value="Q4">Q4</option>
    </select>
  </div>
  <div style="margin-top: 15px; font-size: 14px; color: #64748b;">
    현재 로드된 애니메이션: <span id="currentTitle" style="color: #1e293b; font-weight: 600;">없음</span>
    <span id="status" style="margin-left: 20px;"></span>
    <div style="margin-top: 8px; color: #64748b;">※ 검색 결과에서 각 캐릭터의 성별을 직접 수정할 수 있습니다.</div>
  </div>
</div>

<div class="main">
  <div class="char-list" id="charList"></div>
  <div class="side-panel">
    <textarea id="jsonPreview" readonly placeholder="JSON 결과..."></textarea>
    <button class="btn btn-copy" onclick="copyJSON()">JSON 복사</button>
    <button id="zipBtn" class="btn btn-zip" onclick="downloadImagesZip()" disabled>📦 이미지 다운로드 (.ZIP)</button>
  </div>
</div>

<script>
  const API_URL = 'https://graphql.anilist.co';
  let animeData = null;
  let characterItems = [];

  function sanitize(str) {
    return str.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_');
  }

  // MAL ID를 통해 AniList에서 데이터를 직접 조회 (페이지네이션으로 전체 캐릭터 수집)
  async function fetchByMalId() {
    const malId = document.getElementById('idInput').value;
    if (!malId) { alert("MAL ID를 입력해주세요."); return; }

    const statusEl = document.getElementById('status');
    statusEl.style.color = "#2563eb";

    // startDate { year } 를 추가하여 연도 자동 추출
    const query = `
      query($idMal: Int, $page: Int) {
        Media(idMal: $idMal, type: ANIME) {
          id
          idMal
          title { romaji }
          startDate { year }
          characters(sort: [ROLE, RELEVANCE], page: $page, perPage: 25) {
            pageInfo {
              hasNextPage
              currentPage
            }
            edges {
              role
              node {
                id
                name { full native }
                gender
                image { large }
              }
              voiceActors(language: JAPANESE) {
                id
                name { full }
              }
            }
          }
        }
      }
    `;

    try {
      let page = 1;
      let hasNextPage = true;
      let allEdges = [];
      let mediaMeta = null;

      while (hasNextPage) {
        statusEl.innerText = `⏳ 데이터 조회 중... (페이지 ${page})`;

        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ query: query, variables: { idMal: parseInt(malId), page: page } })
        });

        const json = await res.json();

        if (json.errors) {
          throw new Error("애니메이션을 찾을 수 없습니다. (ID 확인 필요)");
        }

        const media = json.data.Media;
        if (!media) throw new Error("애니메이션을 찾을 수 없습니다. (ID 확인 필요)");

        mediaMeta = { 
          id: media.id, 
          idMal: media.idMal, 
          title: media.title,
          year: media.startDate?.year || "" // 연도 저장
        };
        
        allEdges = allEdges.concat(media.characters.edges);
        hasNextPage = media.characters.pageInfo.hasNextPage;
        page++;

        if (page > 20) break;
      }

      animeData = mediaMeta;
      document.getElementById('currentTitle').innerText = animeData.title.romaji;
      
      // 연도 필드 자동 채우기
      document.getElementById('yearInput').value = animeData.year;

      // BACKGROUND 캐릭터와 일본어 성우가 없는 캐릭터는 추출하지 않는다.
      // 이후 CVData와의 연결을 위해 유효한 voice actor(id + name)가 있는 경우만 포함한다.
      const excludedUnknownCvCount = allEdges.filter(edge =>
        edge.role !== "BACKGROUND" &&
        (!edge.voiceActors?.[0]?.id || !edge.voiceActors?.[0]?.name?.full)
      ).length;

      characterItems = allEdges
        .filter(edge => edge.role !== "BACKGROUND")
        .filter(edge => edge.voiceActors?.[0]?.id && edge.voiceActors?.[0]?.name?.full)
        .map(edge => ({
          // AniList의 전역 Character ID. 이후 Character ↔ CV 연결의 기본 키로 사용한다.
          characterId: edge.node.id,
          // 현재 데이터 구조와의 호환성을 위해 작품의 MAL ID도 함께 저장한다.
          animeId: animeData.idMal,
          // 일본어 성우가 없을 수 있으므로 null을 허용한다.
          cvId: edge.voiceActors[0]?.id ?? null,
          engName: edge.node.name.full,
          korName: edge.node.name.native || edge.node.name.full,
          gender: ["male", "female"].includes((edge.node.gender || "").toLowerCase())
            ? edge.node.gender.toLowerCase()
            : "unknown",
          cv: edge.voiceActors[0]?.name.full || "Unknown",
          imgUrl: edge.node.image.large
        }));

      renderChars();
      updateJSON();
      document.getElementById('zipBtn').disabled = false;
      statusEl.innerText = excludedUnknownCvCount > 0
        ? `✅ ${characterItems.length}명 로드됨 (성우 Unknown/없음 ${excludedUnknownCvCount}명 제외)`
        : `✅ ${characterItems.length}명 로드됨`;

    } catch (err) {
      console.error(err);
      statusEl.innerText = "❌ 에러: " + err.message;
      statusEl.style.color = "#ef4444";
      animeData = null;
    }
  }

  function renderChars() {
    document.getElementById('charList').innerHTML = characterItems.map((c, i) => `
      <div class="char-card">
        <img src="${c.imgUrl}" alt="${c.engName}">
        <div class="edit-fields">
          <input type="text" value="${c.korName}" oninput="updateChar(${i}, 'korName', this.value)" placeholder="한글 이름">
          <input type="text" value="${c.cv}" oninput="updateChar(${i}, 'cv', this.value)" placeholder="성우 이름">
          <select onchange="updateChar(${i}, 'gender', this.value)" aria-label="${c.engName} 성별">
            <option value="male" ${c.gender === 'male' ? 'selected' : ''}>남성</option>
            <option value="female" ${c.gender === 'female' ? 'selected' : ''}>여성</option>
            <option value="unknown" ${c.gender === 'unknown' ? 'selected' : ''}>알 수 없음</option>
          </select>
        </div>
      </div>`).join('');
  }

  function updateChar(i, key, val) {
    characterItems[i][key] = val;
    updateJSON();
  }

  function updateJSON() {
    if (!animeData) return;
    const quarter = document.getElementById('quarterSelect').value;
    const year = document.getElementById('yearInput').value || "0000"; // 연도 값 가져오기
    const animeFolder = sanitize(animeData.title.romaji);

    const out = {
      id: animeData.idMal,
      title: animeData.title.romaji,
      year: parseInt(year) || 0, // 전체 JSON 뎁스에도 year 추가
      characters: characterItems.map(c => ({
        // 표준 식별자: AniList Character ID
        characterId: c.characterId,
        name: c.korName,
        gender: c.gender,
        // 일본어 성우가 없으면 null
        cvId: c.cvId,
        // 기존 사이트/편집 흐름과의 호환을 위해 이름은 유지
        cv: c.cv,
        // 이미지 경로에 {year} 반영
        img: `image/charimg/${year}/${quarter}/${animeFolder}/${sanitize(c.engName)}.jpg`
      }))
    };
    document.getElementById('jsonPreview').value = JSON.stringify(out, null, 2);
  }

  async function downloadImagesZip() {
    const zip = new JSZip();
    const animeFolder = sanitize(animeData.title.romaji);
    document.getElementById('status').innerText = "🚀 이미지 압축 중...";

    await Promise.all(characterItems.map(async (c) => {
      try {
        const imgRes = await fetch(c.imgUrl);
        const blob = await imgRes.blob();
        zip.file(`${animeFolder}/${sanitize(c.engName)}.jpg`, blob);
      } catch (err) { console.error(err); }
    }));

    const content = await zip.generateAsync({type:"blob"});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = `${animeFolder}_images.zip`;
    link.click();
    document.getElementById('status').innerText = "✅ 다운로드 완료!";
  }

  function copyJSON() {
    const t = document.getElementById('jsonPreview');
    t.select();
    document.execCommand('copy');
    alert("JSON 복사됨!");
  }
</script>
</body>
</html>
