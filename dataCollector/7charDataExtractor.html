<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캐릭터 추출기 (MAL ID 검색 버전)</title>
  <link rel="stylesheet" href="./savedCatalog.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; padding: 20px; background: #f8f9fa; }
    .header { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border-top: 5px solid #2563eb; }
    .search-area { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
    #idInput { flex: 1; width: 100%; min-width: 0; box-sizing: border-box; padding: 7px 9px; border: 1px solid #e2e8f0; border-radius: 6px; outline: none; font-size: 13px; }
    #idInput:focus { border-color: #2563eb; }
    .main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 20px; }
    .char-list { min-width: 0; background: white; padding: 20px; border-radius: 12px; height: 750px; overflow-y: auto; border: 1px solid #e2e8f0; }
    .char-card { display: flex; gap: 15px; background: #fff; border: 1px solid #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 12px; }
    .char-card img { flex-shrink: 0; width: 80px; height: 110px; object-fit: cover; border-radius: 6px; background: #f8f9fa; }
    .edit-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .edit-fields input, .edit-fields select { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; font-family: inherit; background: #fff; }
    .edit-fields select:focus, .edit-fields input:focus { outline: none; border-color: #2563eb; }
    .char-source { color: #64748b; font-size: 12px; overflow-wrap: anywhere; }
    .char-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .delete-character { flex-shrink: 0; border: 1px solid #fecaca; border-radius: 6px; background: #fff1f2; color: #b91c1c; padding: 5px 8px; cursor: pointer; font-size: 12px; }
    .delete-character:hover { background: #ffe4e6; }
    .side-panel { min-width: 0; }
    .panel-tools { margin-bottom: 12px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; }
    .manual-search summary { color: #64748b; font-size: 12px; cursor: pointer; }
    .metadata-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
    .metadata-controls label { display: flex; align-items: center; gap: 5px; color: #64748b; font-size: 12px; }
    .compact-button { padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; color: #334155; cursor: pointer; font-size: 12px; }
    .compact-button:disabled { opacity: .45; cursor: not-allowed; }
    #jsonPreview { width: 100%; height: 600px; background: #0f172a; color: #f1f5f9; padding: 15px; border-radius: 12px; font-family: 'Fira Code', monospace; font-size: 12px; box-sizing: border-box; overflow-x: auto; }
    .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-search { background: #2563eb; color: white; width: auto; margin-top: 0; padding: 7px 10px; font-size: 12px; }
    .btn-zip { background: #ea580c; color: white; }
    .btn-copy { background: #16a34a; color: white; }
    .quarter-select { padding: 5px; border-radius: 6px; border: 1px solid #e2e8f0; font-family: inherit; font-size: 12px; }
    #yearInput { width: 64px; }
    #status { font-weight: bold; color: #2563eb; white-space: pre-line; }
    .help { margin-top: 15px; font-size: 14px; color: #64748b; line-height: 1.7; }
    #currentTitle { color: #1e293b; font-weight: 600; }
    body.char-data-collector.collector-with-year-sidebar { margin-left: 300px; }
    body.char-data-collector #collector-year-bar { width: 280px; }
    #collector-year-bar #character-library { margin-top: 24px; }
    #collector-year-bar #character-library h2 { color: #ebdcaa; font-size: 17px; }
    #collector-year-bar #character-library label { font-size: 13px; }
    #collector-year-bar #character-library .saved-catalog-groups { max-height: none; overflow: visible; padding: 0; }
    #collector-year-bar #character-library .catalog-item { margin: 0; padding: 12px; text-align: left; white-space: normal; background: #170a0e; border: 1px solid #4a2a32; color: #e6dcd3; font-weight: 400; }
    #collector-year-bar #character-library .catalog-item:hover,
    #collector-year-bar #character-library .catalog-item[aria-pressed="true"] { background: #33261a; border-color: #c9a55a; }
    #collector-year-bar #character-library .catalog-title { color: #ebdcaa; }
    @media (max-width: 1150px) { .main { grid-template-columns: minmax(0, 1fr); } .char-list { height: 600px; } }
    @media (max-width: 700px) {
      body.char-data-collector.collector-with-year-sidebar { margin-left: 192px; padding: 12px; }
      body.char-data-collector #collector-year-bar { width: 180px; }
      #collector-year-bar #character-library .catalog-item { padding: 8px; }
      #collector-year-bar #character-library .catalog-quarter summary { padding: 10px; }
      .header, .char-list { padding: 12px; }
      .char-card { flex-wrap: wrap; padding: 10px; }
      .edit-fields { flex-basis: 140px; }
    }
  </style>
</head>
<body class="char-data-collector">
<section id="character-library" class="saved-catalog">
  <h2>전체 작품 · 캐릭터 목록</h2>
  <p>작품 카드를 누르면 저장된 캐릭터를 불러옵니다. 미등록 작품은 MAL ID로 검색합니다.</p>
  <div id="character-catalog"></div>
</section>
<div class="header">
  <h2>👥 캐릭터 추출기</h2>
  <div class="help">
    현재 로드된 애니메이션: <span id="currentTitle">없음</span>
    <div id="status" role="status" aria-live="polite">왼쪽에서 작품을 선택해주세요.</div>
    <div>※ 수정·삭제는 현재 편집 결과에 반영됩니다. 원본 파일에 반영하려면 JSON을 복사해주세요. 편집 내용은 페이지를 닫거나 새로고침하면 사라집니다.</div>
  </div>
</div>
<div class="main">
  <div class="char-list" id="charList"></div>
  <div class="side-panel">
    <div class="panel-tools">
      <details class="manual-search">
        <summary>MAL ID 직접 검색</summary>
        <div class="search-area">
          <input type="number" id="idInput" min="1" aria-label="MyAnimeList ID" placeholder="MAL ID" onkeydown="if(event.key === 'Enter') fetchByMalId()">
          <button class="btn btn-search" onclick="fetchByMalId()">불러오기</button>
        </div>
      </details>
      <div class="metadata-controls">
        <label>연도 <input type="number" id="yearInput" class="quarter-select" aria-label="작업 연도" readonly></label>
        <label>이미지 분기 <select id="quarterSelect" class="quarter-select" aria-label="새 캐릭터 이미지 저장 분기" onchange="updateJSON()">
          <option value="Q1">Q1</option><option value="Q2">Q2</option>
          <option value="Q3">Q3</option><option value="Q4">Q4</option>
        </select></label>
        <button id="refreshBtn" class="compact-button" onclick="fetchByMalId({ refresh: true })" disabled>최신 조회</button>
        <button id="undoDeleteBtn" class="compact-button" onclick="undoDeleteCharacter()" disabled>삭제 취소</button>
      </div>
    </div>
    <textarea id="jsonPreview" readonly aria-label="캐릭터 JSON 결과" placeholder="JSON 결과..."></textarea>
    <button id="copyBtn" class="btn btn-copy" onclick="copyJSON()" disabled>JSON 복사</button>
    <button id="zipBtn" class="btn btn-zip" onclick="downloadImagesZip()" disabled>📦 이미지 다운로드 (.ZIP)</button>
    <p class="help">ZIP에는 JSON과 동일한 image/charimg/... 경로가 포함됩니다. 프로젝트 폴더에 풀어주세요.</p>
  </div>
</div>
<script type="text/plain" data-collector-data="animeData"></script>
<script type="text/plain" data-collector-data="animeCharacterData"></script>
<script type="text/plain" data-collector-src="./savedCatalog.js"></script>
<script type="text/plain" data-collector-src="./7charDataExtractor.js"></script>
<script src="../data/manifest.js"></script>
<script src="collectorYear.js"></script>
</body>
</html>
