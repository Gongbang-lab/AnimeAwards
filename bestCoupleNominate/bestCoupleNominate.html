<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 ANIME AWARDS - Nominate</title>
    <link rel="stylesheet" href="bestCoupleNominate.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="../winnerStage.css">
    <link rel="stylesheet" href="../nominationGuide.css">
  <link rel="stylesheet" href="../palette-components.css">
</head>
<body>

    <canvas id="confettiCanvas"></canvas>

    <nav class="top-nav">
        <div class="nav-content-area">
            <span class="brand">2026 ANIME AWARDS</span>
            <span id="step-title"></span>
        </div>
    </nav>

    <main class="content-wrapper">
        <div class="container">
            <section class="content-area" id="mainArea">
                <div class="anime-picker-section">
                    <div class="anime-card-grid" id="animeCardGrid"></div>
                </div>
                <div class="nominee-list" id="nomineeList"></div>
            </section>

            <aside class="sidebar">
                <div class="fixed-sidebar-content">
                    <div id="anime-picker-sidebar" class="anime-picker-sidebar"></div>
                    <div class="action-buttons">
                        <button class="btn-outline" id="goMainBtn">메인으로</button>
                        <button class="gold-btn" id="confirmAwardBtn" disabled>수상 결정</button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <div id="charModal" class="modal hidden">
        <div class="modal-content large-modal">
            <span class="close-btn" id="closeCharModal">&times;</span>
            <h2 id="modalAnimeTitle">캐릭터 선택</h2>
            <p class="modal-desc">커플로 등록할 두 명의 캐릭터를 선택해주세요.</p>
            <div class="character-grid" id="characterGrid"></div>
            <button id="addCoupleBtn" class="gold-btn full-width" disabled style="margin-top:20px;">후보 등록 (0/2)</button>
        </div>
    </div>

    <div id="awardModal" class="modal hidden">
    <div class="modal-content">
        <h2 class="award-title">🏆 BEST COUPLE AWARD</h2>
        <div class="award-anime-title" id="awardAnimeTitle">작품 제목</div>
        
        <div class="award-couple-display">
            <div class="award-char">
                <img id="awardImg1" src="" alt="">
                <span id="awardName1">이름1</span>
            </div>
            <div class="heart-icon">♥</div>
            <div class="award-char">
                <img id="awardImg2" src="" alt="">
                <span id="awardName2">이름2</span>
            </div>
        </div>

        <button id="finalConfirmBtn" class="gold-btn">확인 및 메인으로</button>
    </div>
</div>

    <script src="../data/manifest.js"></script>
    <script type="text/plain" data-app-src="../resultStorage.js"></script>
    <script type="text/plain" data-year-src="../data/{year}/{year}animeCharacterData.js"></script>
    <script type="text/plain" data-year-src="../data/{year}/{year}animeData.js"></script>
    <script type="text/plain" data-app-src="../data/resolveYear.js"></script>
    <script type="text/plain" data-app-src="../seasonFilter.js"></script>
    <script type="text/plain" data-app-src="../nominateCommon.js"></script>
    <script type="text/plain" data-app-src="../winnerStage.js"></script>
    <script type="text/plain" data-app-src="bestCoupleNominate.js"></script>
    <script type="text/plain" data-app-src="../firebase_service.js" data-module="true"></script>
    <script type="text/plain" data-app-src="../nominationGuide.js"></script>
<script src="../data/pageLoader.js"></script>
</body>
</html>
